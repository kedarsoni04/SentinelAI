name: SentinelAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Validation ─────────────────────────────────────────────────────
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies (OpenCV & PostgreSQL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libpq-dev

      - name: Install Python Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///./test_sentinel.db
          JWT_SECRET_KEY: test-secret-key-32-chars-long-minimum-size
        run: |
          python -m pytest tests -v

  # ─── Frontend Validation ────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate TypeScript Types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
